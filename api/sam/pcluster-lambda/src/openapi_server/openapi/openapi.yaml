openapi: 3.0.2
info:
  description: ParallelCluster API
  title: ParallelCluster
  version: 3.0.0
servers:
- url: /v3
{#security:#}
{#- aws.auth.sigv4: []#}
paths:
  /clusters:
    get:
      description: Retrieve the list of existing clusters managed by the API.
      operationId: list_clusters
      parameters:
      - description: List clusters deployed to a given AWS Region
        explode: true
        in: query
        name: region
        required: true
        schema:
          description: List clusters deployed to a given AWS Region
          type: string
        style: form
      - explode: true
        in: query
        name: nextToken
        required: false
        schema:
          type: string
        style: form
      - description: List deleted clusters.
        explode: true
        in: query
        name: showDeleted
        required: false
        schema:
          description: List deleted clusters.
          nullable: true
          type: boolean
        style: form
      - description: Forces a specific ParallelCluster version to be used when handling
          this request.
        explode: false
        in: header
        name: x-parallelcluster-version
        required: false
        schema:
          description: Forces a specific ParallelCluster version to be used when handling
            this request.
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListClustersResponseContent'
          description: ListClusters 200 response
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestExceptionResponseContent'
          description: BadRequestException 400 response
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedClientErrorResponseContent'
          description: UnauthorizedClientError 401 response
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededExceptionResponseContent'
          description: LimitExceededException 429 response
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceExceptionResponseContent'
          description: InternalServiceException 500 response
      tags:
      - Cluster CRUD
      x-amazon-apigateway-integration:
        credentials:
          Fn::Sub: "${APIGatewayExecutionRole.Arn}"
        httpMethod: POST
        payloadFormatVersion: "2.0"
        type: aws_proxy
        uri:
          Fn::Sub: "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiGatewayLambdaFunction.Arn}/invocations"
      x-openapi-router-controller: openapi_server.controllers.cluster_crud_controller
    post:
      description: Create a ParallelCluster managed cluster in a given region.
      operationId: create_cluster
      parameters:
      - description: ParallelCluster version to use when creating the cluster. This
          option will only be available in case the API has support for multiple ParallelCluster
          versions
        explode: true
        in: query
        name: version
        required: false
        schema:
          description: ParallelCluster version to use when creating the cluster. This
            option will only be available in case the API has support for multiple
            ParallelCluster versions
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
          type: string
        style: form
      - description: "Identifies one or more config validators to suppress. Format:\
          \ ALL|id:$value|level:(info|error|warning)|type:$value"
        explode: true
        in: query
        name: suppressValidators
        required: false
        schema:
          description: "Identifies one or more config validators to suppress. Format:\
            \ ALL|id:$value|level:(info|error|warning)|type:$value"
          items:
            type: string
          type: array
        style: form
      - description: Min validation level that will cause the creation to fail. Defaults
          to 'error'.
        explode: true
        in: query
        name: validationFailureLevel
        required: false
        schema:
          $ref: '#/components/schemas/ValidationLevel'
        style: form
      - description: "Only perform request validation without creating any resource.\
          \ It can be used to validate the cluster configuration. Response code: 200"
        explode: true
        in: query
        name: dryrun
        required: false
        schema:
          description: "Only perform request validation without creating any resource.\
            \ It can be used to validate the cluster configuration. Response code:\
            \ 200"
          nullable: true
          type: boolean
        style: form
      - description: When set it automatically initiates a cluster stack rollback
          on failures. Defaults to true.
        explode: true
        in: query
        name: rollbackOnFailure
        required: false
        schema:
          description: When set it automatically initiates a cluster stack rollback
            on failures. Defaults to true.
          nullable: true
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClusterRequestContent'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClusterResponseContent'
          description: CreateCluster 202 response
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClusterBadRequestExceptionResponseContent'
          description: CreateClusterBadRequestException 400 response
        "401":
          content:
            application/json:
