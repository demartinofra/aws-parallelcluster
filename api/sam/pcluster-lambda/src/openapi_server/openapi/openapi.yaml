components:
  schemas:
    AmiInfo:
      example:
        amiId: amiId
        os: os
        name: name
        architecture: architecture
      properties:
        amiId:
          type: string
        os:
          type: string
        name:
          type: string
        architecture:
          type: string
      required:
      - amiId
      - architecture
      - name
      - os
      type: object
    BadRequestExceptionResponseContent:
      description: This exception is thrown when a client calls an API with wrong
        parameters
      properties:
        message:
          type: string
      type: object
    BuildImageBadRequestExceptionResponseContent:
      description: This exception is thrown when a client calls the BuildImage API
        with an invalid request. This includes an error due to invalid image configuration.
      properties:
        configurationValidationErrors:
          items:
            $ref: '#/components/schemas/ConfigValidationMessage'
          type: array
        message:
          type: string
      type: object
    BuildImageRequestContent:
      example:
        imageConfiguration: imageConfiguration
        name: name
        region: region
      properties:
        imageConfiguration:
          description: Image configuration as a YAML document
          format: byte
          type: string
        name:
          description: Name of the image
          maxLength: 60
          minLength: 5
          pattern: "^[a-zA-Z][a-zA-Z0-9-]+$"
          type: string
        region:
          description: AWS Region
          type: string
      required:
      - imageConfiguration
      - name
      - region
      type: object
    BuildImageResponseContent:
      example:
        image:
          imageId: imageId
          imageBuildStatus: null
          cloudformationStackStatus: null
          cloudformationStackArn: cloudformationStackArn
          region: region
          version: version
        validationMessages:
        - level: null
          id: id
          type: type
          message: message
        - level: null
          id: id
          type: type
          message: message
      properties:
        image:
          $ref: '#/components/schemas/ImageInfoSummary'
        validationMessages:
          description: List of messages collected during image config validation whose
            level is lower than the validationFailureLevel set by the user
          items:
            $ref: '#/components/schemas/ConfigValidationMessage'
          type: array
      required:
      - image
      - validationMessages
      type: object
    CloudFormationStatus:
      enum:
      - CREATE_IN_PROGRESS
      - CREATE_FAILED
      - CREATE_COMPLETE
      - ROLLBACK_IN_PROGRESS
      - ROLLBACK_FAILED
      - ROLLBACK_COMPLETE
