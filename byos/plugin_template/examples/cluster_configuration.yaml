Image:
  Os: alinux2
HeadNode:
  InstanceType: c5.xlarge
  Ssh:
    KeyName: <KEY_NAME>
  Networking:
    SubnetId: <HEAD_SUBNET>
Scheduling:
  Scheduler: byos
  ByosSettings:
    SchedulerDefinition: <PLUGIN_DEFINITION>
    GrantSudoPriviledges: true
    CustomSettings:
      CustomKey1: CustomValue1
  ByosQueues:
    - Name: queue1
      Networking:
        SubnetIds:
          - <COMPUTE_SUBNET>
      CustomSettings:
        CustomQueueKey1: CustomValue1
      ComputeResources:
        - Name: cr1
          InstanceType: c5.xlarge
          CustomSettings:
            CustomComputeResourceKey1: CustomValue1
